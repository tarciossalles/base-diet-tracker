<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BASE Diet Tracker - Calculadora de Refeições</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Google Fonts: Poppins -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        poppins: ['Poppins', 'sans-serif'],
                    },
                    colors: {
                        baseRed: '#BD0000',
                        baseBlack: '#000000',
                        baseWhite: '#FFFFFF',
                    }
                }
            }
        }
    </script>

    <style>
        /* Custom scrollbar for chat */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f1f1;
        }
        ::-webkit-scrollbar-thumb {
            background: #BD0000;
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #a00000;
        }
        
        .markdown-body strong {
            font-weight: 600;
            color: #BD0000;
        }
        .markdown-body br {
            display: block;
            margin-bottom: 0.5em;
        }
        .markdown-body ul {
            list-style-type: disc;
            padding-left: 1.5rem;
            margin-top: 0.5rem;
            margin-bottom: 0.5rem;
        }
        
        /* Pulse animation for recording */
        @keyframes pulse-ring {
            0% { transform: scale(0.8); box-shadow: 0 0 0 0 rgba(189, 0, 0, 0.7); }
            70% { transform: scale(1); box-shadow: 0 0 0 10px rgba(189, 0, 0, 0); }
            100% { transform: scale(0.8); box-shadow: 0 0 0 0 rgba(189, 0, 0, 0); }
        }
        .recording-active {
            animation: pulse-ring 2s infinite;
            background-color: #BD0000 !important;
            color: white !important;
        }
    </style>
</head>
<body class="bg-baseWhite text-baseBlack font-poppins h-screen flex flex-col overflow-hidden">

    <!-- Header -->
    <header class="bg-white text-baseRed p-4 shadow-md border-b-4 border-baseRed flex justify-between items-center z-10">
        <div class="flex items-center gap-3">
            <div class="w-10 h-10 bg-baseRed text-white rounded flex items-center justify-center font-bold text-xl tracking-wider">
                B
            </div>
            <div>
                <h1 class="font-bold text-lg leading-tight">BASE Tracker</h1>
                <p class="text-xs text-gray-500">Calculadora de Refeições</p>
            </div>
        </div>
        <button id="clear-history-btn" class="text-xs bg-white text-baseRed hover:bg-baseRed hover:text-white transition-colors px-3 py-2 rounded font-medium border border-baseRed">
            Limpar
        </button>
    </header>

    <!-- Chat Area -->
    <main id="chat-container" class="flex-1 overflow-y-auto p-4 flex flex-col gap-4 bg-gray-50">
        <!-- Messages will be injected here by JS -->
    </main>

    <!-- Error/Notification Toast -->
    <div id="toast-notification" class="hidden fixed top-20 left-1/2 transform -translate-x-1/2 bg-baseBlack text-white px-4 py-2 rounded shadow-lg text-sm z-50 transition-opacity duration-300">
        Mensagem de erro aqui.
    </div>

    <!-- Loading Indicator -->
    <div id="loading-indicator" class="hidden px-4 py-2 bg-gray-50 flex items-center gap-2 text-sm text-baseRed italic">
        <div class="w-2 h-2 bg-baseRed rounded-full animate-bounce"></div>
        <div class="w-2 h-2 bg-baseRed rounded-full animate-bounce" style="animation-delay: 0.1s"></div>
        <div class="w-2 h-2 bg-baseRed rounded-full animate-bounce" style="animation-delay: 0.2s"></div>
        <span>Analisando...</span>
    </div>

    <!-- Footer / Input Area -->
    <footer class="bg-white border-t border-gray-200 p-4 shadow-[0_-2px_10px_rgba(0,0,0,0.05)] z-10">
        <form id="chat-form" class="flex gap-2 max-w-4xl mx-auto mb-2 items-center">
            <button type="button" id="mic-btn" class="bg-white border border-gray-200 hover:bg-gray-100 text-baseRed rounded-full p-3 transition-all shadow-sm flex-shrink-0 focus:outline-none" title="Gravar áudio">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11a7 7 0 01-7 7m0 0a7 7 0 01-7-7m7 7v4m0 0H8m4 0h4m-4-8a3 3 0 01-3-3V5a3 3 0 116 0v6a3 3 0 01-3 3z" />
                </svg>
            </button>
            <input 
                type="text" 
                id="message-input" 
                class="flex-1 bg-white border border-gray-300 text-baseBlack rounded-full px-5 py-3 focus:outline-none focus:border-baseRed focus:ring-1 focus:ring-baseRed transition-all text-sm placeholder-gray-400 shadow-inner"
                placeholder="Digite sua refeição ou grave um áudio..."
                autocomplete="off"
            >
            <button 
                type="submit" 
                id="send-btn"
                class="bg-baseRed hover:bg-red-800 text-white rounded-full px-5 py-3 font-semibold transition-colors flex items-center justify-center shadow-md disabled:opacity-50 flex-shrink-0 focus:outline-none"
            >
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
                  <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-8.707l-3-3a1 1 0 00-1.414 0l-3 3a1 1 0 001.414 1.414L9 9.414V13a1 1 0 102 0V9.414l1.293 1.293a1 1 0 001.414-1.414z" clip-rule="evenodd" />
                </svg>
            </button>
        </form>
        <div class="text-center text-xs mt-2 px-4">
            <a href="https://www.teambasebr.com" target="_blank" class="text-baseRed hover:underline font-semibold">
                Para acompanhamento, estratégia e resultado definitivo, venha para a Consultoria BASE.
            </a>
        </div>
    </footer>

    <script>
        const SYSTEM_PROMPT = `Você é o Rastreador de Calorias e Analista Nutricional da BASE.
Diretrizes rigorosas a seguir:
1. Primeira interação: Peça Nome, Idade, Peso e Objetivo (se o usuário não tiver fornecido).
2. Se o usuário fornecer os dados pessoais: Calcule a Taxa Metabólica Basal (TMB) e o Gasto Energético Total (GET) de forma conservadora usando a equação de Harris-Benedict. Apresente APENAS os valores de manutenção. NÃO prescreva déficit calórico, superávit ou plano de dieta.
3. Se o usuário descrever refeições (áudio ou texto): Identifique os itens, estime calorias e macronutrientes (Proteínas, Carboidratos, Gorduras) de cada um e o total. SEMPRE alerte que os valores são estimativas.
4. Tom de Voz: Simples, motivador e direto. Sem jargão técnico.
5. REGRA ABSOLUTA E OBRIGATÓRIA: O último parágrafo de TODAS as suas respostas (sem exceção) DEVE ser EXATAMENTE este texto: "Para acompanhamento, estratégia e resultado definitivo, venha para a Consultoria BASE: https://www.teambasebr.com"`;

        const WELCOME_MESSAGE = {
            role: 'model',
            text: "Olá! Bem-vindo ao BASE Diet Tracker. Para começarmos, por favor, me diga seu **Nome, Idade, Peso e Objetivo**."
        };

        // State Management
        let chatHistory = [];
        const STORAGE_KEY = 'base_diet_tracker_history';
        const DAYS_TO_KEEP = 7;

        // DOM Elements
        const chatContainer = document.getElementById('chat-container');
        const chatForm = document.getElementById('chat-form');
        const messageInput = document.getElementById('message-input');
        const loadingIndicator = document.getElementById('loading-indicator');
        const clearBtn = document.getElementById('clear-history-btn');
        const micBtn = document.getElementById('mic-btn');
        const toast = document.getElementById('toast-notification');

        // Utilities
        function showToast(msg) {
            toast.textContent = msg;
            toast.classList.remove('hidden');
            setTimeout(() => toast.classList.add('hidden'), 4000);
        }

        function parseMarkdown(text) {
            let html = text;
            html = html.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
            html = html.replace(/\*(.*?)\*/g, '<em>$1</em>');
            html = html.replace(/\n/g, '<br>');
            return html;
        }

        function scrollToBottom() {
            setTimeout(() => {
                chatContainer.scrollTop = chatContainer.scrollHeight;
            }, 50);
        }

        // Rendering
        function renderMessage(role, text) {
            const wrapper = document.createElement('div');
            wrapper.className = `flex w-full ${role === 'user' ? 'justify-end' : 'justify-start'}`;
            
            const bubble = document.createElement('div');
            
            if (role === 'user') {
                bubble.className = "bg-baseRed text-white p-4 rounded-2xl rounded-tr-sm shadow-md max-w-[85%] text-sm";
                bubble.textContent = text;
            } else {
                bubble.className = "bg-white text-gray-800 p-4 rounded-2xl rounded-tl-sm shadow-md max-w-[85%] border-l-4 border-baseRed text-sm markdown-body border border-gray-200";
                
                // Add Name label for AI
                const nameLabel = document.createElement('p');
                nameLabel.className = "font-semibold text-baseRed mb-2 text-xs uppercase tracking-wide";
                nameLabel.textContent = "BASE AI";
                bubble.appendChild(nameLabel);

                const content = document.createElement('div');
                content.innerHTML = parseMarkdown(text);
                bubble.appendChild(content);
            }
            
            wrapper.appendChild(bubble);
            chatContainer.appendChild(wrapper);
            scrollToBottom();
        }

        function renderAllMessages() {
            chatContainer.innerHTML = '';
            
            // Always ensure welcome message is first if history is empty
            if (chatHistory.length === 0) {
                chatHistory.push({...WELCOME_MESSAGE, timestamp: Date.now()});
            }
            
            chatHistory.forEach(msg => renderMessage(msg.role, msg.text));
        }

        // Storage Operations
        function loadHistory() {
            try {
                const stored = localStorage.getItem(STORAGE_KEY);
                if (stored) {
                    const parsed = JSON.parse(stored);
                    const now = Date.now();
                    const maxAge = DAYS_TO_KEEP * 24 * 60 * 60 * 1000;
                    
                    // Filter out old messages
                    chatHistory = parsed.filter(msg => (now - msg.timestamp) < maxAge);
                }
            } catch (e) {
                console.error("Error loading history:", e);
                chatHistory = [];
            }
            renderAllMessages();
        }

        function saveHistory() {
            try {
                localStorage.setItem(STORAGE_KEY, JSON.stringify(chatHistory));
            } catch (e) {
                console.error("Error saving history:", e);
                if (e.name === 'QuotaExceededError') {
                    showToast("Armazenamento cheio. Limpando mensagens antigas.");
                    chatHistory = chatHistory.slice(-10); // Keep last 10
                    localStorage.setItem(STORAGE_KEY, JSON.stringify(chatHistory));
                }
            }
        }

        function addMessageToState(role, text) {
            chatHistory.push({ role, text, timestamp: Date.now() });
            saveHistory();
            renderMessage(role, text);
        }

        // API Call
        async function fetchGeminiResponse(userText, inlineData = null) {
            loadingIndicator.classList.remove('hidden');
            scrollToBottom();
            
            try {
                const apiKey = ""; // Gemini API injected automatically in Canvas
                const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3-flash-preview:generateContent?key=${apiKey}`;
                
                // Construct conversation history for API (excluding timestamps)
                const contents = chatHistory.map(msg => ({
                    role: msg.role === 'model' ? 'model' : 'user',
                    parts: [{ text: msg.text }]
                }));

                // If inlineData (Audio) is present, replace the last text entry with complex payload
                if (inlineData) {
                    contents[contents.length - 1] = {
                        role: 'user',
                        parts: [
                            { text: "Analise o áudio anexo e me responda com base nele." },
                            { inlineData: inlineData }
                        ]
                    };
                }

                const payload = {
                    systemInstruction: { parts: [{ text: SYSTEM_PROMPT }] },
                    contents: contents
                };

                const response = await fetch(apiUrl, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                if (!response.ok) throw new Error(`API Error: ${response.status}`);
                
                const data = await response.json();
                
                if (data.candidates && data.candidates[0].content?.parts) {
                    const botReply = data.candidates[0].content.parts[0].text;
                    addMessageToState('model', botReply);
                } else {
                    throw new Error("Formato de resposta inválido.");
                }
            } catch (error) {
                console.error("API Error:", error);
                showToast("Erro de conexão. Tente novamente.");
            } finally {
                loadingIndicator.classList.add('hidden');
            }
        }

        // Event Listeners: Text Input
        chatForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            if (isRecording) return; // Don't submit text if mic is active

            const text = messageInput.value.trim();
            if (!text) return;
            
            messageInput.value = '';
            addMessageToState('user', text);
            await fetchGeminiResponse(text);
        });

        // Event Listeners: History Control
        clearBtn.addEventListener('click', () => {
            if (confirm("Apagar todo o histórico de conversas?")) {
                chatHistory = [];
                localStorage.removeItem(STORAGE_KEY);
                loadHistory(); // Will re-inject welcome message
            }
        });

        // Audio Recording Logic
        let isRecording = false;
        let mediaRecorder = null;
        let audioChunks = [];

        function blobToBase64(blob) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onloadend = () => resolve(reader.result.split(',')[1]);
                reader.onerror = reject;
                reader.readAsDataURL(blob);
            });
        }

        async function startRecording() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                mediaRecorder = new MediaRecorder(stream);
                audioChunks = [];

                mediaRecorder.ondataavailable = (event) => {
                    if (event.data.size > 0) audioChunks.push(event.data);
                };

                mediaRecorder.onstop = async () => {
                    const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
                    
                    // Reset UI
                    micBtn.classList.remove('recording-active');
                    messageInput.disabled = false;
                    messageInput.placeholder = "Digite sua refeição ou grave um áudio...";
                    
                    try {
                        const base64Data = await blobToBase64(audioBlob);
                        const displayMsg = "🎙️ Áudio enviado (Análise em andamento...)";
                        addMessageToState('user', displayMsg);
                        
                        await fetchGeminiResponse(displayMsg, {
                            mimeType: 'audio/webm',
                            data: base64Data
                        });
                    } catch (err) {
                        showToast("Erro ao processar o áudio.");
                    }
                    
                    // Stop tracks to release microphone hardware icon
                    stream.getTracks().forEach(track => track.stop());
                };

                mediaRecorder.start();
                isRecording = true;
                
                // Update UI
                micBtn.classList.add('recording-active');
                messageInput.disabled = true;
                messageInput.value = '';
                messageInput.placeholder = "Gravando... Clique no microfone para parar.";

            } catch (err) {
                console.error("Mic Access Error:", err);
                showToast("Permissão de microfone negada ou indisponível.");
                isRecording = false;
            }
        }

        function stopRecording() {
            if (mediaRecorder && mediaRecorder.state !== 'inactive') {
                mediaRecorder.stop();
            }
            isRecording = false;
        }

        micBtn.addEventListener('click', () => {
            if (!isRecording) {
                startRecording();
            } else {
                stopRecording();
            }
        });

        // Initialize
        window.addEventListener('DOMContentLoaded', loadHistory);

    </script>
</body>
</html>
